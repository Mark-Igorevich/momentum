name: SKILLDOCS browser transport probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'skilldocs-audit/**'
      - '.github/workflows/skilldocs-audit.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        shell: pwsh
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Run browser transport probe
        shell: pwsh
        run: node skilldocs-audit/probe.mjs
      - name: Upload probe screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skilldocs-browser-probe-20260731
          path: probe-*.png
          retention-days: 7
          if-no-files-found: warn
