name: SKILLDOCS targeted form inventory matrix

on:
  pull_request:
    branches: [main]
    paths:
      - 'skilldocs-audit/**'
      - '.github/workflows/skilldocs-audit.yml'

permissions:
  contents: read

jobs:
  targeted-inventory:
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        attempt: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Probe SKILLDOCS reachability
        id: probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $probeFile = Join-Path $env:RUNNER_TEMP "skilldocs-probe.html"
          $codeFile = Join-Path $env:RUNNER_TEMP "skilldocs-code.txt"
          curl.exe -4 -sS -L --http1.1 --connect-timeout 10 --max-time 25 `
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36" `
            -o $probeFile -w "%{http_code}" https://skilldocs.pl/ | Out-File -FilePath $codeFile -Encoding ascii
          $curlExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          $code = if (Test-Path $codeFile) { (Get-Content $codeFile -Raw).Trim() } else { "" }
          $size = if (Test-Path $probeFile) { (Get-Item $probeFile).Length } else { 0 }
          $reachable = ($curlExit -eq 0 -and $code -eq "200" -and $size -gt 100000)
          "reachable=$($reachable.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "attempt=${{ matrix.attempt }} reachable=$reachable curlExit=$curlExit http=$code bytes=$size"
          exit 0

      - name: Set up Node.js
        if: steps.probe.outputs.reachable == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        if: steps.probe.outputs.reachable == 'true'
        shell: pwsh
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Build patched audit runtime
        if: steps.probe.outputs.reachable == 'true'
        shell: pwsh
        run: |
          node skilldocs-audit/runtime-patch.mjs skilldocs-audit/audit.mjs skilldocs-audit/audit-runtime.mjs
          node --check skilldocs-audit/audit-runtime.mjs

      - name: Inspect representative forms and popups without submission
        if: steps.probe.outputs.reachable == 'true'
        shell: pwsh
        env:
          BASE_URL: https://skilldocs.pl/
          AUDIT_URLS: >-
            https://skilldocs.pl/,
            https://skilldocs.pl/uk/,
            https://skilldocs.pl/en/,
            https://skilldocs.pl/pl/,
            https://skilldocs.pl/kontakty/,
            https://skilldocs.pl/uk/kontakti/,
            https://skilldocs.pl/en/contacts/,
            https://skilldocs.pl/pl/kontakty-2/,
            https://skilldocs.pl/o-kompanii/,
            https://skilldocs.pl/uk/pro-kompaniyu/,
            https://skilldocs.pl/en/about-company/,
            https://skilldocs.pl/pl/o-firmie/,
            https://skilldocs.pl/karta-pobyta/blue-card/,
            https://skilldocs.pl/uk/karta-pobutu/blakitna-karta-blue-card/,
            https://skilldocs.pl/en/residence-card/blue-card-2/,
            https://skilldocs.pl/pl/karta-pobytu-pl/niebieska-karta-blue-card/,
            https://skilldocs.pl/online-podacha-cherez-mos/,
            https://skilldocs.pl/pl/zus-dla-jdg-w-polsce/
          SUBMIT_FORMS: 'false'
          TEST_PHONE: '+48570804478'
          TEST_EMAIL: contact@skilldocs.pl
          MAX_URLS: '25'
          MAX_FORM_SUBMISSIONS: '0'
          PAGE_TIMEOUT_MS: '60000'
          ACTION_TIMEOUT_MS: '9000'
          AUDIT_ID: SD-TARGETED-FORM-INVENTORY-20260731
        run: node skilldocs-audit/audit-runtime.mjs

      - name: Upload targeted inventory
        if: steps.probe.outputs.reachable == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: skilldocs-targeted-form-inventory-attempt-${{ matrix.attempt }}
          path: skilldocs-audit/output
          retention-days: 7
          if-no-files-found: warn

      - name: Stop remaining attempts after reachable run
        if: steps.probe.outputs.reachable == 'true' && always()
        shell: pwsh
        run: exit 1
